name: Package development builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: dist:mac
            artifact: macos-development-package
            glob: release/*.dmg
          - os: windows-latest
            command: dist:win
            artifact: windows-development-package
            glob: release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run ${{ matrix.command }}
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find release -path '*/Dusk & Dawn.app/Contents/MacOS/Dusk & Dawn' -type f -print -quit)
          test -n "$app"
          DUSK_ELECTRON_EXECUTABLE="$PWD/$app" npm run test:desktop
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DUSK_ELECTRON_EXECUTABLE = Join-Path $pwd 'release/win-unpacked/Dusk & Dawn.exe'
          npm run test:desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
